---
- name: Backup FRR configuration
  hosts: frr
  gather_facts: false

  tasks:
    - name: Save running config
      ansible.netcommon.cli_command:
        command: vtysh -c "write memory"

    - name: Fetch FRR config
      fetch:
        src: /etc/frr/frr.conf
        dest: backups/{{ inventory_hostname }}.conf
        flat: yes
